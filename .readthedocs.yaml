# Read the Docs configuration file for Sphinx projects.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
# NOTE: this file must stay at the repository ROOT. Read the Docs only searches
# the root for .readthedocs.yaml (and the legacy .readthedocs.yml /
# readthedocs.yaml / readthedocs.yml names); it does not look in subdirectories.
# A config placed in docs/ is silently ignored unless the project defines a
# custom "Path for .readthedocs.yaml" in its RTD admin settings. All paths below
# are relative to the repository root, regardless of where this file sits.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # The docs build clean; fail the build on any new warning to catch regressions.
  fail_on_warning: true

# No additional output formats: HTML only.
#
# The PDF format is deliberately not built. It runs the Sphinx LaTeX builder,
# which has to rasterise the mermaid diagrams in docs/uml.rst with `mmdc`
# (mermaid-cli, a Node tool that pulls in Puppeteer and a headless Chromium).
# That tool is not available in the build environment, so the LaTeX builder
# emits "command 'mmdc' cannot be run", and with fail_on_warning above that
# fails the whole build. HTML is unaffected: mermaid renders in the browser.
#
# Note that ``UML/BayesCal-UML.pdf``, referenced from docs/uml.rst, is a file
# committed in the repository and has nothing to do with this setting.
#
# To restore the PDF, install mermaid-cli in the build instead of removing
# fail_on_warning, by adding a nodejs tool and a post_install job:
#
#   build:
#     tools:
#       nodejs: "20"
#     jobs:
#       post_install:
#         - npm install -g @mermaid-js/mermaid-cli
formats: []

# Only the lightweight documentation requirements are installed; the heavy
# runtime dependencies are mocked in conf.py (autodoc_mock_imports).
python:
  install:
    - requirements: docs/requirements-docs.txt
