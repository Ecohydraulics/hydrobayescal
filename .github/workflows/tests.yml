# Runs the checks a contributor is asked to run before pushing (CONTRIBUTING.md)
# on every push to any branch and on every pull request. A change that breaks an
# existing test, does not parse, or breaks the documentation build is then
# visible on the branch it was pushed to, and not only when that branch is
# merged.
#
# None of the jobs needs a solver: the test suite replaces TELEMAC, OpenFOAM and
# Delft3D by stubs and by an analytic model.
name: tests

on:
  push:
    branches: ["**"]   # branches only; a release tag points at a tested commit
  pull_request:
  workflow_dispatch:

# The jobs only read the repository. Whatever a pushed branch contains, a run of
# this workflow cannot change a branch, a tag, a release or a pull request, so a
# push to a contributor branch has no effect on main. (The default token of this
# repository may write; this narrows it for the workflow.)
permissions:
  contents: read

# A newer push to the same branch supersedes the run of the older one. The
# group is per branch, so a run on one branch never cancels a run on another.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax errors and undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the rule groups that report definite errors: E9 (the file does not
      # parse), F63 (comparisons that are always true or always false), F7
      # (statements in a place where they cannot run) and F82 (undefined names).
      # The code base is clean for these. The other pyflakes rules are not
      # enforced, because the bindings and the drivers import function_pool
      # with `import *`. The target version makes syntax that Python 3.10 does
      # not accept an error as well.
      - name: ruff
        run: pipx run ruff check --target-version py310 --select E9,F63,F7,F82 src tests examples env-scripts docs/conf.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest interpreter the package declares support for.
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The default torch wheel for Linux bundles the CUDA libraries, several
      # gigabytes that the tests never use. The CPU build is installed first, and
      # pip then finds the torch requirement of the package satisfied.
      - name: Install PyTorch (CPU build)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install HydroBayesCal with the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same inputs as the Read the Docs build (.readthedocs.yaml): the light
      # documentation requirements only, the heavy runtime stack mocked in
      # docs/conf.py, and every warning treated as an error.
      - name: Install the documentation requirements
        run: python -m pip install -r docs/requirements-docs.txt

      - name: Build the HTML documentation
        run: python -m sphinx -b html -W docs docs/_build/html
